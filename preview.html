<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Particle Field</title>
<style>
  :root {
    --bg: #05060a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: crosshair;
  }
  .hud {
    position: fixed;
    left: 16px;
    bottom: 14px;
    color: rgba(180, 210, 255, 0.55);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    pointer-events: none;
    user-select: none;
    line-height: 1.7;
  }
  .hud b { color: rgba(140, 200, 255, 0.9); font-weight: 600; }
  .title {
    position: fixed;
    left: 16px;
    top: 14px;
    color: rgba(180, 210, 255, 0.35);
    font-size: 11px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    pointer-events: none;
    user-select: none;
  }
  .prompt {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px 8px 14px;
    border-radius: 999px;
    background: rgba(12, 18, 32, 0.72);
    border: 1px solid rgba(90, 130, 190, 0.35);
    backdrop-filter: blur(8px);
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
    z-index: 10;
  }
  .prompt input {
    width: min(46vw, 340px);
    background: transparent;
    border: none;
    outline: none;
    color: #dbe9ff;
    font: inherit;
    font-size: 13px;
    letter-spacing: 0.06em;
  }
  .prompt input::placeholder { color: rgba(150, 180, 220, 0.45); }
  .prompt button {
    border: none;
    border-radius: 999px;
    padding: 7px 14px;
    background: rgba(90, 150, 240, 0.22);
    color: #cfe2ff;
    font: inherit;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .prompt button:hover { background: rgba(90, 150, 240, 0.4); }
  .prompt button:active { background: rgba(90, 150, 240, 0.55); }
  .chips {
    position: fixed;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 5px;
    width: min(150px, 22vw);
    max-height: 72vh;
    overflow-y: auto;
    padding: 8px;
    border-radius: 14px;
    background: rgba(5, 8, 16, 0.28);
    backdrop-filter: blur(6px);
    scrollbar-width: thin;
    z-index: 10;
  }
  .chips button {
    border: 1px solid rgba(90, 130, 190, 0.28);
    border-radius: 999px;
    padding: 6px 9px;
    background: rgba(12, 18, 32, 0.58);
    color: rgba(180, 210, 255, 0.68);
    font: inherit;
    font-size: 9px;
    letter-spacing: 0.10em;
    text-transform: uppercase;
    cursor: pointer;
    white-space: nowrap;
    transition: background .15s ease, border-color .15s ease, color .15s ease;
  }
  .chips button:hover {
    color: #dbe9ff;
    border-color: rgba(120, 180, 255, 0.6);
    background: rgba(30, 55, 90, 0.68);
  }
  @media (max-width: 700px) {
    .chips {
      right: 8px;
      top: auto;
      bottom: 78px;
      transform: none;
      width: calc(100vw - 16px);
      max-width: none;
      max-height: 58px;
      flex-direction: row;
      flex-wrap: nowrap;
      overflow-x: auto;
      overflow-y: hidden;
    }
    .chips button.active { color: #e9f4ff; border-color: rgba(130, 195, 255, 0.85); background: rgba(70, 130, 220, 0.26); }
    .chips button { flex: 0 0 auto; }
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="title">Particle Field</div>
<div class="hud">
  <div>move <b>cursor</b> to attract &middot; choose a <b>shape</b> below</div>
  <div><b id="fps">--</b> fps &middot; <b id="count">--</b> particles &middot; <b id="shape">free</b></div>
</div>
<div class="chips" id="chips"></div>
<form class="prompt" id="prompt">
  <input id="word" type="text" placeholder="type a word or emoji — rabbit, cat, star…" autocomplete="off" spellcheck="false" />
  <button type="submit">Form</button>
</form>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d', { alpha: false });
  const fpsEl = document.getElementById('fps');
  const countEl = document.getElementById('count');
  const shapeEl = document.getElementById('shape');
  const promptForm = document.getElementById('prompt');
  const wordInput = document.getElementById('word');
  const chipsEl = document.getElementById('chips');

  let W = 0, H = 0, DPR = 1;

  // ---------------------------------------------------------------- config
  const CONFIG = {
    baseCount: 420,          // healthy field population; shapes use only these living particles
    maxCount: 900,           // hard cap
    mouseRadius: 190,        // influence radius of the cursor
    mouseRadiusSq: 190 * 190,
    attract: 0.055,          // pull strength toward cursor
    swirl: 0.9,              // tangential (orbital) force
    friction: 0.965,
    maxSpeed: 3.4,
    wander: 0.055,           // constant self-propulsion (keeps them moving)
    minSpeed: 0.35,          // never let a particle stall
    mergeDist: 9,            // particles this close are considered touching
    mergeDistSq: 81,
    bounce: 0.58,            // softer restitution: collisions feel less like billiards
    spawnOnContact: 0,       // collisions no longer breed new particles
    cohesion: 0.020,         // pull toward the local formation centroid
    cohesionRadius: 150,     // how far formation influence reaches
    cohesionRadiusSq: 150 * 150,
    netDist: 96,             // max distance for a communication link
    netDistSq: 96 * 96,
    netBreakDist: 128,       // links snap once stretched past this
    netBreakDistSq: 128 * 128,
    netFadeIn: 0.16,         // how fast a new link brightens
    netFadeOut: 0.09,        // how fast a broken link dims out
    netStrength: 0.34,       // base opacity of a link
    netBoost: 0.42,          // extra opacity from cluster size
    netCluster: 14,          // particles needed for full network strength
    burstCount: 26,
    burstPower: 7.5,
    hueBase: 205,            // base hue (blue)
    hueSpread: 90,           // hue variation across particles
    trailAlpha: 0.22,        // background fade per frame (motion trails)
    contactFlash: 0.45,      // seconds the yellow contact glow lasts
    contactHue: 52,          // hue of the contact glow (yellow)
    lifeMin: 8,              // shortest lifespan of a particle (seconds)
    lifeMax: 18,             // longest lifespan of a particle (seconds)
    fadeIn: 0.9,             // seconds a particle takes to fade in
    fadeOut: 1.6,            // seconds a particle takes to fade out
    respawnRate: 1.10,       // particles per second added back to the field

    // --- swarm behaviour -------------------------------------------
    swarmCount: 5,           // number of roaming swarms
    swarmSize: 26,           // particles per swarm
    swarmSpeed: 2.6,         // how fast a swarm's core travels
    swarmTurn: 0.05,         // how sharply a swarm can change heading
    swarmRadius: 46,         // spread of particles around the swarm core
    swarmRadiusSq: 46 * 46,
    swarmPull: 0.055,        // pull toward the swarm core
    swarmOrbit: 0.06,        // tangential drift around the core
    swarmMaxSpeed: 7.5,      // swarms move much faster than free particles
    swarmLife: 22,           // seconds a swarm lives before dispersing

    // --- word shapes ------------------------------------------------
    shapeCount: 520,         // particles used to draw a silhouette
    shapeDamp: 0.90,         // velocity damping while forming
    shapeMaxSpeed: 7.0,       // cap while forming
    shapeHold: 11.5,            // seconds the shape holds before dispersing
    shapeJitter: 0.35,       // px of noise on each target point
    shapeDelayMax: 0.95,     // stagger the arrival so the formation grows organically
    shapeSteer: 0.072,       // how quickly particles bend toward their target velocity
    shapeOrbit: 0.95,        // temporary orbital flow around the forming shape
    shapeNoise: 0.30,        // subtle turbulence during travel
    shapeSettle: 0.055,      // velocity damping when very close to the target
    shapeMinParticles: 120,  // minimum particles for a readable formation
    shapeMaxParticles: 340,  // do not consume the whole field unless needed
    shapeParticleSpacing: 15, // approximate visual spacing between shape particles
    shapeMotion: 0.92,       // overall shape movement response
    shapeDeform: 1.0,        // strength of local shape deformation
    shapeDissolve: 2.6,      // seconds the shape takes to melt back into the flow
  };

  // ---------------------------------------------------------------- state
  const particles = [];
  const swarms = [];
  const mouse = { x: -9999, y: -9999, active: false, down: false };
  let time = 0;
  let last = performance.now();
  let fpsAccum = 0, fpsFrames = 0;
  let spawnAccum = 0;   // fractional respawn credit, so births are gradual
  let shape = null;     // active word formation, or null when free-roaming

  // ---------------------------------------------------------------- utils
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

  // Monotonic id source. Declared before Particle so the constructor can never
  // hit the temporal dead zone if a particle is created earlier than boot.
  let nextId = 1;

  // ---------------------------------------------------------------- shape behaviours
  // Every per-shape motion lives here, in one place. Each entry may define:
  //   local(u, v, lx, ly, seed, wave) -> { dx, dy, angle, scale }
  //     per-particle deformation, in the shape's own local space
  //   centroid(t, seed, w, h) -> { dx, dy }
  //     how the whole formation drifts across the viewport
  //   effects(ctx, x, y, time, pulse)
  //     decorative particles drawn behind the formation
  // Adding a new shape is now a single entry instead of edits in three places.
  const SHAPE_BEHAVIORS = {
    rocket: {
      local(u, v, lx, ly, seed, wave) {
        // Flight motion + body lift + a living flame region at the bottom.
        const flame = clamp((v - 0.48) / 0.52, 0, 1);
        return {
          angle: Math.sin(wave * 0.72) * 0.028,
          dx: Math.sin(wave * 0.44) * 72 + flame * Math.sin(wave * 9.0 + seed * 2.0) * 4,
          dy: Math.sin(wave * 0.96) * 17 + flame * (3 + 7 * Math.sin(wave * 7.5 + seed) * 0.5),
        };
      },
      centroid(t, seed, w, h) {
        return {
          dx: Math.sin(t * 0.44 + seed) * Math.min(90, w * 0.08),
          dy: Math.sin(t * 0.91 + seed * 1.7) * Math.min(28, h * 0.035),
        };
      },
      effects(ctx, x, y, time) {
        // Soft exhaust plume below the moving rocket.
        const baseY = y + Math.min(W, H) * 0.24 + 8 + Math.sin(time * 1.18) * 5;
        for (let i = 0; i < 22; i++) {
          const a = time * (2 + i * 0.03) + i * 2.4;
          const rise = (i / 22) * 70 + ((time * 55 + i * 13) % 30);
          const px = x + Math.sin(a) * (4 + rise * 0.08);
          const py = baseY + rise;
          const r = Math.max(0.5, 2.8 - rise * 0.025);
          ctx.fillStyle = `hsla(${35 + (i % 3) * 18}, 100%, 68%, ${0.18 * (1 - rise / 100)})`;
          ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI * 2); ctx.fill();
        }
      },
    },

    fish: {
      local(u, v, lx, ly, seed, wave) {
        // A travelling wave through the body, strongest toward the tail.
        const tail = clamp((-u + 0.05) / 1.05, 0, 1);
        const waveValue = Math.sin(wave * 4.2 - lx * 0.035 + seed) * tail;
        return {
          angle: Math.sin(wave * 0.75) * 0.022,
          dx: Math.cos(wave * 2.1 + seed) * tail * 2.2 + Math.sin(wave * 0.48) * 48,
          dy: waveValue * 10 * CONFIG.shapeDeform + Math.sin(wave * 0.95) * 5,
        };
      },
      centroid(t, seed, w, h) {
        return {
          dx: Math.sin(t * 0.42 + seed) * Math.min(80, w * 0.07),
          dy: Math.sin(t * 0.88) * Math.min(18, h * 0.025),
        };
      },
      effects(ctx, x, y, time) {
        // Small bubbles trailing behind aquatic forms.
        for (let i = 0; i < 9; i++) {
          const phase = i * 1.7;
          const bx = x - 80 - ((time * (10 + i) + i * 37) % 80);
          const by = y + Math.sin(time * 1.2 + phase) * 18 + i * 3;
          const r = 1 + (i % 3) * 0.7;
          ctx.strokeStyle = `hsla(195, 90%, 75%, ${0.18 - i * 0.012})`;
          ctx.lineWidth = 0.8;
          ctx.beginPath(); ctx.arc(bx, by, r, 0, Math.PI * 2); ctx.stroke();
        }
      },
    },

    bird: {
      local(u, v, lx, ly, seed, wave) {
        // A gentle wingbeat: outer wing particles travel more than the body.
        const wing = clamp(Math.abs(u) * 1.15, 0, 1) * clamp(1 - Math.abs(v) * 0.9, 0, 1);
        const flap = Math.sin(wave * 3.0 + seed) * wing;
        return {
          angle: Math.sin(wave * 0.7) * 0.035,
          dx: Math.sign(lx || 1) * flap * 2.5,
          dy: flap * 8 * CONFIG.shapeDeform + Math.sin(wave * 0.85) * 5,
        };
      },
      centroid(t, seed, w, h) {
        return {
          dx: Math.sin(t * 0.55 + seed) * Math.min(38, w * 0.035),
          dy: Math.sin(t * 1.05 + seed) * Math.min(20, h * 0.025),
        };
      },
      effects(ctx, x, y, time, pulse) {
        // Tiny surrounding particles orbiting the living form.
        for (let i = 0; i < 7; i++) {
          const a = time * (0.35 + i * 0.03) + i * 0.9;
          const rr = 105 + Math.sin(time * 1.2 + i) * 10;
          const px = x + Math.cos(a) * rr;
          const py = y + Math.sin(a) * rr * 0.55;
          ctx.fillStyle = `hsla(${195 + i * 12}, 90%, 75%, ${0.12 + pulse * 0.05})`;
          ctx.beginPath(); ctx.arc(px, py, 1.1, 0, Math.PI * 2); ctx.fill();
        }
      },
    },

    butterfly: {
      local(u, v, lx, ly, seed, wave) {
        // Opposing flutter on the two wings so it reads as a living insect.
        const wing = clamp(Math.abs(u), 0, 1) * clamp(1 - Math.abs(v) * 0.65, 0, 1);
        const flap = Math.sin(wave * 4.5 + seed) * wing;
        return {
          dx: Math.sign(lx || 1) * flap * 6,
          dy: flap * 9 * (0.7 + 0.3 * Math.abs(u)) + Math.sin(wave * 1.05) * 5,
        };
      },
      centroid(t, seed, w, h) {
        return {
          dx: Math.sin(t * 0.55 + seed) * Math.min(38, w * 0.035),
          dy: Math.sin(t * 1.05 + seed) * Math.min(20, h * 0.025),
        };
      },
      effects(ctx, x, y, time, pulse) {
        for (let i = 0; i < 7; i++) {
          const a = time * (0.35 + i * 0.03) + i * 0.9;
          const rr = 105 + Math.sin(time * 1.2 + i) * 10;
          const px = x + Math.cos(a) * rr;
          const py = y + Math.sin(a) * rr * 0.55;
          ctx.fillStyle = `hsla(${195 + i * 12}, 90%, 75%, ${0.12 + pulse * 0.05})`;
          ctx.beginPath(); ctx.arc(px, py, 1.1, 0, Math.PI * 2); ctx.fill();
        }
      },
    },

    tree: {
      local(u, v, lx, ly, seed, wave) {
        // Wind passes through the canopy; the trunk barely moves.
        const top = clamp((-v + 0.05) / 1.05, 0, 1);
        return {
          angle: Math.sin(wave * 0.62) * 0.018,
          dx: Math.sin(wave * 0.9 + v * 2.5) * top * 7 * CONFIG.shapeDeform,
        };
      },
    },

    leaf: {
      local(u, v, lx, ly, seed, wave) {
        const top = clamp((-v + 0.1) / 1.1, 0, 1);
        return {
          angle: Math.sin(wave * 1.05) * (0.035 + top * 0.035),
          dx: Math.sin(wave * 1.2 + v * 3) * top * 5,
          dy: Math.cos(wave * 1.0 + u * 2) * top * 2,
        };
      },
      centroid(t, seed, w, h) {
        return {
          dx: Math.sin(t * 0.55 + seed) * Math.min(24, w * 0.02),
          dy: Math.cos(t * 0.42) * Math.min(14, h * 0.018),
        };
      },
    },

    car: {
      local(u, v, lx, ly, seed, wave) {
        // Small suspension bob rather than rigid translation.
        const body = clamp((v + 0.2) / 1.2, 0, 1);
        return {
          angle: Math.sin(wave * 0.65) * 0.015,
          dx: Math.sin(wave * 0.55) * 55,
          dy: Math.sin(wave * 1.5) * 3 + Math.sin(wave * 3.1 + seed) * body * 1.8,
        };
      },
      centroid(t, seed, w, h) {
        return {
          dx: Math.sin(t * 0.35 + seed) * Math.min(72, w * 0.06),
          dy: Math.sin(t * 0.95) * Math.min(10, h * 0.015),
        };
      },
      effects(ctx, x, y, time) {
        // Faint dust / heat wake behind the car.
        for (let i = 0; i < 14; i++) {
          const px = x - 110 - ((time * 24 + i * 19) % 55);
          const py = y + 45 + Math.sin(time * 1.5 + i) * 8;
          ctx.fillStyle = `hsla(35, 35%, 75%, ${0.06 + (i % 4) * 0.015})`;
          ctx.beginPath(); ctx.arc(px, py, 1 + (i % 3), 0, Math.PI * 2); ctx.fill();
        }
      },
    },

    plane: {
      local(u, v, lx, ly, seed, wave) {
        const body = clamp((v + 0.2) / 1.2, 0, 1);
        return {
          angle: Math.sin(wave * 0.65) * 0.015,
          dx: Math.sin(wave * 0.55) * 55,
          dy: Math.sin(wave * 1.5) * 3 + Math.sin(wave * 3.1 + seed) * body * 1.8,
        };
      },
      centroid(t, seed, w, h) {
        return {
          dx: Math.sin(t * 0.35 + seed) * Math.min(72, w * 0.06),
          dy: Math.sin(t * 0.95) * Math.min(10, h * 0.015),
        };
      },
    },

    boat: {
      local(u, v, lx, ly, seed, wave) {
        return {
          angle: Math.sin(wave * 0.9) * 0.04,
          dx: Math.sin(wave * 0.36) * 28,
          dy: Math.sin(wave * 1.0) * 6,
        };
      },
      centroid(t, seed, w, h) {
        return {
          dx: Math.sin(t * 0.28 + seed) * Math.min(55, w * 0.045),
          dy: Math.sin(t * 0.9) * Math.min(22, h * 0.03),
        };
      },
      effects(ctx, x, y, time, pulse) {
        ctx.strokeStyle = 'rgba(130,210,255,0.20)';
        ctx.lineWidth = 1;
        for (let i = 0; i < 4; i++) {
          const yy = y + 48 + i * 7;
          const span = 25 + i * 12 + pulse * 8;
          ctx.beginPath();
          ctx.moveTo(x - span, yy);
          ctx.quadraticCurveTo(x, yy + Math.sin(time * 2 + i) * 4, x + span, yy);
          ctx.stroke();
        }
      },
    },

    heart: {
      local(u, v, lx, ly, seed, wave) {
        return {
          scale: Math.sin(wave * 2.2) * 0.020,
          dy: Math.sin(wave * 2.2 + seed) * 1.5,
        };
      },
      effects(ctx, x, y, time, pulse) {
        ctx.strokeStyle = `rgba(255,110,150,${0.05 + pulse * 0.04})`;
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(x, y, 110 + pulse * 8, 0, Math.PI * 2); ctx.stroke();
      },
    },

    star: {
      local(u, v, lx, ly, seed, wave) {
        const shimmer = Math.sin(wave * 3.0 + seed) * 1.3;
        return { angle: wave * 0.045, dx: shimmer * u, dy: shimmer * v };
      },
      effects(ctx, x, y, time, pulse) {
        for (let i = 0; i < 14; i++) {
          const a = i * Math.PI * 2 / 14 + time * 0.12;
          const rr = 90 + Math.sin(time * 1.5 + i) * 12;
          const px = x + Math.cos(a) * rr;
          const py = y + Math.sin(a) * rr;
          ctx.fillStyle = `hsla(48, 100%, 78%, ${0.08 + pulse * 0.06})`;
          ctx.beginPath(); ctx.arc(px, py, 1.2 + pulse, 0, Math.PI * 2); ctx.fill();
        }
      },
    },

    sun: {
      local(u, v, lx, ly, seed, wave) {
        const shimmer = Math.sin(wave * 3.0 + seed) * 1.3;
        return { angle: wave * 0.045, dx: shimmer * u, dy: shimmer * v };
      },
      effects(ctx, x, y, time, pulse) {
        for (let i = 0; i < 14; i++) {
          const a = i * Math.PI * 2 / 14 + time * 0.12;
          const rr = 90 + Math.sin(time * 1.5 + i) * 12;
          const px = x + Math.cos(a) * rr;
          const py = y + Math.sin(a) * rr;
          ctx.fillStyle = `hsla(48, 100%, 78%, ${0.08 + pulse * 0.06})`;
          ctx.beginPath(); ctx.arc(px, py, 1.2 + pulse, 0, Math.PI * 2); ctx.fill();
        }
      },
    },

    moon: {
      local(u, v, lx, ly, seed, wave) {
        const shimmer = Math.sin(wave * 3.0 + seed) * 1.3;
        return { angle: wave * 0.045, dx: shimmer * u, dy: shimmer * v };
      },
    },

    cloud: {
      local(u, v, lx, ly, seed, wave) {
        return {
          dx: Math.sin(wave * 0.24) * 16,
          dy: Math.sin(wave * 0.7 + seed) * 3,
        };
      },
      centroid(t, seed, w, h) {
        return {
          dx: Math.sin(t * 0.22 + seed) * Math.min(55, w * 0.045),
          dy: Math.sin(t * 0.55) * Math.min(12, h * 0.018),
        };
      },
    },

    bee: {
      local(u, v, lx, ly, seed, wave) {
        const wing = clamp(1 - Math.abs(v) * 1.8, 0, 1) * clamp(Math.abs(u) * 1.5, 0, 1);
        const flap = Math.sin(wave * 8.0 + seed) * wing;
        return {
          angle: Math.sin(wave * 1.3) * 0.05,
          dx: Math.sin(wave * 2.2 + seed) * 6,
          dy: flap * 5,
        };
      },
    },

    turtle: {
      local(u, v, lx, ly, seed, wave) {
        return {
          dx: Math.sin(wave * 0.45) * 18,
          dy: Math.sin(wave * 0.8) * 2.5,
        };
      },
    },

    balloon: {
      local(u, v, lx, ly, seed, wave) {
        return {
          angle: Math.sin(wave * 0.7) * 0.025,
          dx: Math.sin(wave * 0.55) * 28,
          dy: Math.sin(wave * 0.8) * 10,
        };
      },
      centroid(t, seed, w, h) {
        return {
          dx: Math.sin(t * 0.48 + seed) * Math.min(45, w * 0.035),
          dy: Math.sin(t * 0.78 + seed) * Math.min(36, h * 0.05),
        };
      },
    },

    music: {
      local(u, v, lx, ly, seed, wave) {
        return {
          angle: Math.sin(wave * 1.1) * 0.025,
          dy: Math.sin(wave * 2.0 + seed) * 3,
        };
      },
    },

    smile: {
      local(u, v, lx, ly, seed, wave) {
        return { scale: Math.sin(wave * 1.7) * 0.009 };
      },
    },
  };

  // Shared behaviour for aquatic forms and for the generic fallback.
  SHAPE_BEHAVIORS.dolphin = SHAPE_BEHAVIORS.fish;
  SHAPE_BEHAVIORS.whale = SHAPE_BEHAVIORS.fish;
  SHAPE_BEHAVIORS.spaceship = SHAPE_BEHAVIORS.rocket;

  const GENERIC_BEHAVIOR = {
    local(u, v, lx, ly, seed, wave) {
      // Generic organic drift for remaining symbols/objects.
      return {
        angle: Math.sin(wave * 0.55 + seed) * 0.012,
        dx: Math.sin(wave * 0.42 + seed) * 8,
        dy: Math.sin(wave * 0.75 + seed * 1.7) * 3,
      };
    },
  };

  // ---------------------------------------------------------------- particle
  class Particle {
    constructor(x, y, opts = {}) {
      this.x = x ?? rand(0, W);
      this.y = y ?? rand(0, H);
      const a = rand(0, Math.PI * 2);
      const s = opts.speed ?? rand(0.15, 0.85);
      this.vx = Math.cos(a) * s;
      this.vy = Math.sin(a) * s;
      this.r = opts.r ?? rand(0.7, 2.4);
      this.id = nextId++;
      this.hue = CONFIG.hueBase + rand(-CONFIG.hueSpread / 2, CONFIG.hueSpread / 2);
      // every particle is mortal: it fades in, lives a while, then fades out
      this.maxLife = opts.life ?? rand(CONFIG.lifeMin, CONFIG.lifeMax);
      this.age = 0;
      this.life = 1;
      this.mass = this.r * this.r * 0.6 + 0.4;
      this.phase = rand(0, Math.PI * 2);
      this.pulse = rand(0.6, 1.6);
      this.energy = 0;                   // 0..1, brightens near cursor
      this.wanderAngle = rand(0, Math.PI * 2);
      this.wanderRate = rand(0.6, 1.8);  // how quickly its heading drifts
      this.drift = rand(0.7, 1.3);       // per-particle wander strength
      this.absorbed = 0;                 // how many collisions it has been in
      this.flash = 0;                    // 0..1 pop on contact
      this.contact = 0;                  // seconds of yellow glow remaining
      this.dead = false;                 // removed from the field
      this.swarm = null;                 // swarm this particle belongs to
      this.tx = null;                    // target point when forming a shape
      this.ty = null;
      this.targetDelay = 0;              // staggered start time for formation motion
      this.targetSeed = rand(0, Math.PI * 2);
      this.arrived = false;              // has it reached its shape target
      this.inFormation = false;          // already part of a shape (survives re-forms)
      this.tier = null;                  // 'edge' | 'detail' | 'fill' while in a shape
      this.edge = false;                 // sits on the silhouette outline
      this.edgeBoost = 0;                // 0..1 extra brightness for outline particles
    }

    getAnimatedTarget() {
      if (!shape || this.tx === null) return { x: this.tx, y: this.ty };

      const cx = shape.cx, cy = shape.cy;
      const lx = this.tx - shape.baseCx;
      const ly = this.ty - shape.baseCy;
      const u = clamp(lx / Math.max(1, shape.size * 0.5), -1, 1);
      const v = clamp(ly / Math.max(1, shape.size * 0.5), -1, 1);

      const seed = this.targetSeed;
      const wave = time;

      // Every formation gets a very small, slow "breathing" motion. This is
      // deliberately tiny: the silhouette should remain recognisable while
      // individual particles continue to move like matter rather than pixels.
      let scale = 1 + Math.sin(wave * 1.15 + seed) * 0.006 * CONFIG.shapeDeform;

      // One lookup drives all per-shape deformation.
      const behavior = SHAPE_BEHAVIORS[shape.text] || GENERIC_BEHAVIOR;
      const local = behavior.local ? behavior.local(u, v, lx, ly, seed, wave) : null;
      let dx = 0, dy = 0, angle = 0;
      if (local) {
        dx = local.dx || 0;
        dy = local.dy || 0;
        angle = local.angle || 0;
        if (local.scale) scale += local.scale;
      }

      const c = Math.cos(angle), si = Math.sin(angle);
      const rx = (lx * c - ly * si) * scale;
      const ry = (lx * si + ly * c) * scale;
      return { x: cx + rx + dx, y: cy + ry + dy };
    }

    step(dt) {
      // --- shape mode: fluid / velocity-based formation -------------------
      // Particles do not snap or point directly at the final pixel. They first
      // get caught by a moving flow around the target, then progressively steer
      // into their exact destination. This creates visible, organic motion.
      if (this.tx !== null) {
        const formationAge = shape ? shape.age : 99;
        const activeAge = formationAge - this.targetDelay;

        // A particle that was already part of a formation must not stall when
        // the shape changes: shape.age resets to 0 on every re-form, which
        // would make activeAge negative and freeze it. `inFormation` lets it
        // keep flowing straight into its new target instead.
        if (activeAge <= 0 && !this.inFormation) {
          // Keep drifting naturally until this particle's formation wave arrives.
          this.wanderAngle += Math.sin(time * 0.8 + this.targetSeed) * 0.018 * dt;
          this.vx += Math.cos(this.wanderAngle) * 0.045 * dt;
          this.vy += Math.sin(this.wanderAngle) * 0.045 * dt;
          this.vx *= 0.995;
          this.vy *= 0.995;
          this.x += this.vx * dt;
          this.y += this.vy * dt;
          this.arrived = false;

          // Life continues during formation. A particle can fade and die here
          // just as it can in free flight.
          this.age += dt / 60;
          const remaining = this.maxLife - this.age;
          if (remaining <= 0) { this.life = 0; this.dead = true; }
          else if (remaining < CONFIG.fadeOut) this.life = remaining / CONFIG.fadeOut;
          else if (this.age < CONFIG.fadeIn) this.life = this.age / CONFIG.fadeIn;
          else this.life = 1;
          return;
        }

        const target = this.getAnimatedTarget();
        const dx = target.x - this.x;
        const dy = target.y - this.y;
        const d = Math.hypot(dx, dy);
        const inv = 1 / Math.max(d, 0.001);

        // More speed when far away, graceful braking near the target.
        const approach = clamp(d / 260, 0, 1);
        const desiredSpeed = 0.8 + approach * (this.targetDelay > 0.3 ? 6.8 : 7.8);

        let desiredVx = dx * inv * desiredSpeed;
        let desiredVy = dy * inv * desiredSpeed;

        // Add a temporary curl around the formation centre so trajectories curve
        // instead of looking like hundreds of straight lines.
        if (shape && shape.cx !== undefined) {
          const cdx = this.x - shape.cx;
          const cdy = this.y - shape.cy;
          const cd = Math.hypot(cdx, cdy);
          if (cd > 1) {
            const orbitFade = clamp(d / 180, 0, 1) * (1 - clamp(activeAge / 2.8, 0, 1));
            const orbit = CONFIG.shapeOrbit * orbitFade;
            desiredVx += (-cdy / cd) * orbit;
            desiredVy += ( cdx / cd) * orbit;
          }
        }

        // Low-amplitude turbulence keeps the cloud alive during convergence.
        const noise = CONFIG.shapeNoise * clamp(d / 180, 0, 1);
        desiredVx += Math.cos(time * 1.7 + this.targetSeed) * noise;
        desiredVy += Math.sin(time * 1.45 + this.targetSeed * 1.31) * noise;

        // Steer velocity rather than teleporting position.
        const steer = clamp(CONFIG.shapeSteer * dt * (0.65 + approach * 0.8), 0, 1);
        this.vx += (desiredVx - this.vx) * steer;
        this.vy += (desiredVy - this.vy) * steer;

        // Hard cap to keep the motion cinematic rather than explosive.
        let sp2 = this.vx * this.vx + this.vy * this.vy;
        const cap = CONFIG.shapeMaxSpeed;
        if (sp2 > cap * cap) {
          const k = cap / Math.sqrt(sp2);
          this.vx *= k;
          this.vy *= k;
        }

        if (d < 26) {
          this.vx *= 1 - CONFIG.shapeSettle * dt;
          this.vy *= 1 - CONFIG.shapeSettle * dt;
        }

        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.energy = Math.min(1, this.energy + 0.025 * dt);
        const wasArrived = this.arrived;
        this.arrived = d < 4.5;
        // A one-frame flare the moment a particle locks into the silhouette,
        // so the shape appears to "ignite" as it completes.
        if (this.arrived && !wasArrived) this.flash = Math.max(this.flash, 0.85);
        if (d < 2.2) {
          // reuse the target already computed above instead of recomputing it
          this.x += (target.x - this.x) * 0.14;
          this.y += (target.y - this.y) * 0.14;
        }

        // Keep the normal birth -> life -> fade -> death cycle active even
        // while particles are part of the silhouette.
        this.age += dt / 60;
        const remaining = this.maxLife - this.age;
        if (remaining <= 0) { this.life = 0; this.dead = true; }
        else if (remaining < CONFIG.fadeOut) this.life = remaining / CONFIG.fadeOut;
        else if (this.age < CONFIG.fadeIn) this.life = this.age / CONFIG.fadeIn;
        else this.life = 1;
        return;
      }

      // --- swarm mode: chase the moving core of the swarm --------------
      if (this.swarm) {
        const s = this.swarm;
        const dx = s.x - this.x;
        const dy = s.y - this.y;
        const d2 = dx * dx + dy * dy;
        if (d2 > 0.01) {
          const d = Math.sqrt(d2);
          const inv = 1 / d;
          // pull toward the core, easing off once inside the swarm radius
          const inside = d < CONFIG.swarmRadius ? d / CONFIG.swarmRadius : 1;
          const pull = CONFIG.swarmPull * (0.35 + inside);
          this.vx += dx * inv * pull * dt;
          this.vy += dy * inv * pull * dt;
          // tangential orbit so the swarm churns instead of collapsing
          const orbit = CONFIG.swarmOrbit * (1 - inside * 0.5);
          this.vx += -dy * inv * orbit * dt;
          this.vy += dx * inv * orbit * dt;
        }
        // inherit a share of the swarm's own velocity so it keeps pace
        this.vx += s.vx * 0.06 * dt;
        this.vy += s.vy * 0.06 * dt;
        this.energy = Math.min(1, this.energy + 0.02 * dt);
      }

      // --- constant wander: nothing ever sits still -------------------
      this.wanderAngle += rand(-1, 1) * this.wanderRate * 0.12 * dt;
      const w = CONFIG.wander * this.drift;
      this.vx += Math.cos(this.wanderAngle) * w * dt;
      this.vy += Math.sin(this.wanderAngle) * w * dt;

      // --- formation cohesion: drift toward the local cluster ---------
      if (this.cx !== undefined) {
        const dx = this.cx - this.x;
        const dy = this.cy - this.y;
        const d2 = dx * dx + dy * dy;
        if (d2 > 1 && d2 < CONFIG.cohesionRadiusSq) {
          const d = Math.sqrt(d2);
          const f = (1 - d / CONFIG.cohesionRadius) * CONFIG.cohesion;
          this.vx += (dx / d) * f * dt;
          this.vy += (dy / d) * f * dt;
        }
      }

      // --- cursor influence -------------------------------------------
      if (mouse.active) {
        const dx = mouse.x - this.x;
        const dy = mouse.y - this.y;
        const d2 = dx * dx + dy * dy;
        if (d2 < CONFIG.mouseRadiusSq && d2 > 0.01) {
          const d = Math.sqrt(d2);
          const falloff = 1 - d / CONFIG.mouseRadius;   // 0..1
          const f = falloff * falloff;                  // ease
          const inv = 1 / d;

          // radial pull
          const pull = CONFIG.attract * f * (mouse.down ? 2.4 : 1);
          this.vx += dx * inv * pull;
          this.vy += dy * inv * pull;

          // tangential swirl (perpendicular vector)
          const swirl = CONFIG.swirl * f * 0.06;
          this.vx += -dy * inv * swirl;
          this.vy += dx * inv * swirl;

          this.energy = Math.min(1, this.energy + f * 0.25);
        }
      }

      // --- integrate ---------------------------------------------------
      this.vx *= CONFIG.friction;
      this.vy *= CONFIG.friction;

      const cap = this.swarm ? CONFIG.swarmMaxSpeed : CONFIG.maxSpeed;
      let sp2 = this.vx * this.vx + this.vy * this.vy;
      if (sp2 > cap * cap) {
        const k = cap / Math.sqrt(sp2);
        this.vx *= k;
        this.vy *= k;
        sp2 = cap * cap;
      } else if (sp2 < CONFIG.minSpeed * CONFIG.minSpeed) {
        // re-energize stalled particles so the field never freezes
        const k = CONFIG.minSpeed / Math.max(Math.sqrt(sp2), 0.0001);
        this.vx *= k;
        this.vy *= k;
      }

      this.x += this.vx * dt;
      this.y += this.vy * dt;

      // --- hard containment: particles never leave the frame ----------
      const pad = this.r + 1;
      if (this.x < pad) { this.x = pad; this.vx = Math.abs(this.vx); }
      else if (this.x > W - pad) { this.x = W - pad; this.vx = -Math.abs(this.vx); }
      if (this.y < pad) { this.y = pad; this.vy = Math.abs(this.vy); }
      else if (this.y > H - pad) { this.y = H - pad; this.vy = -Math.abs(this.vy); }

      // --- decay / energy relaxation ---------------------------------
      // dt is normalised to 60fps units, so pow(base, dt) gives the same
      // decay per second regardless of the display refresh rate.
      this.energy *= Math.pow(0.94, dt);
      this.flash *= Math.pow(0.90, dt);
      // the yellow contact glow burns for exactly contactFlash seconds
      if (this.contact > 0) this.contact = Math.max(0, this.contact - dt / 60);

      // --- ageing: fade in, live, then fade out and die -----------------
      this.age += dt / 60;
      const remaining = this.maxLife - this.age;
      if (remaining <= 0) {
        this.life = 0;
        this.dead = true;
      } else if (remaining < CONFIG.fadeOut) {
        this.life = remaining / CONFIG.fadeOut;          // fade out
      } else if (this.age < CONFIG.fadeIn) {
        this.life = this.age / CONFIG.fadeIn;            // fade in
      } else {
        this.life = 1;
      }
    }
    draw() {
      const twinkle = 0.75 + 0.25 * Math.sin(time * this.pulse + this.phase);
      const e = Math.max(this.energy, this.flash);
      // 1 -> 0 over the contact window, with a smooth ease-out
      const c = this.contact > 0 ? this.contact / CONFIG.contactFlash : 0;
      const cEase = c * c;
      // The tier gives the silhouette a three-level hierarchy: a bright, large
      // outline; a mid-weight detail band; and a dim, small interior. That
      // contrast is what makes the shape read as a solid object with an edge
      // rather than a flat cloud of dots.
      const eb = this.edgeBoost;
      const alpha = clamp(this.life * (0.35 + 0.65 * twinkle) * (0.55 + e * 0.45) * (1 + eb * 0.55), 0, 1);
      const radius = this.r * (1 + e * 0.9) * (1 + eb * 0.5);
      const light = 58 + e * 34 + eb * 26;

      ctx.beginPath();
      ctx.arc(this.x, this.y, radius, 0, Math.PI * 2);
      // a touch warms the body toward yellow, then it cools back to its own hue
      const bodyHue = cEase > 0.01 ? this.hue + (CONFIG.contactHue - this.hue) * cEase : this.hue;
      const bodyLight = light + cEase * 22;
      const sat = 95 - eb * 45;
      ctx.fillStyle = `hsla(${bodyHue}, ${sat}%, ${bodyLight}%, ${alpha})`;
      ctx.fill();

      // A soft halo on the brightest particles gives the formation a glow
      // without a second full-canvas pass. Only drawn when it will be visible.
      if (eb > 0.4 || e > 0.5) {
        const glow = Math.max(eb, e);
        ctx.beginPath();
        ctx.arc(this.x, this.y, radius * 2.6, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${bodyHue}, 90%, ${bodyLight}%, ${alpha * glow * 0.16})`;
        ctx.fill();
      }
    }
  }

  // ---------------------------------------------------------------- grid
  // Spatial hash grid keeps neighbour queries near O(n) instead of O(n^2).
  // cellSize is sized so a +/-2 cell scan covers cohesionRadius (150px):
  // 2 * 75 = 150, so the 5x5 neighbourhood in updateFormations is exact.
  const cellSize = 75;
  let grid = new Map();
  const key = (cx, cy) => cx * 100003 + cy;

  // New particles are born at the boundary and drift inward, rather than
  // popping into existence randomly in the middle of the field.
  function spawnFromEdge() {
    const edge = Math.floor(rand(0, 4));
    const margin = 6;
    let x, y, vx, vy;
    if (edge === 0) {
      x = rand(0, W); y = -margin; vx = rand(-0.35, 0.35); vy = rand(0.45, 1.1);
    } else if (edge === 1) {
      x = W + margin; y = rand(0, H); vx = rand(-1.1, -0.45); vy = rand(-0.35, 0.35);
    } else if (edge === 2) {
      x = rand(0, W); y = H + margin; vx = rand(-0.35, 0.35); vy = rand(-1.1, -0.45);
    } else {
      x = -margin; y = rand(0, H); vx = rand(0.45, 1.1); vy = rand(-0.35, 0.35);
    }
    const p = new Particle(x, y, { speed: 0, r: rand(0.7, 2.1) });
    p.vx = vx;
    p.vy = vy;
    p.age = rand(0, CONFIG.fadeIn * 0.75);
    p.life = Math.min(1, p.age / CONFIG.fadeIn);
    return p;
  }

  // Communication network. Links are persistent objects: they appear when two
  // particles come into range, brighten as the local cluster grows, and fade
  // away when the pair drifts apart.
  const links = new Map();
  const pairKey = (a, b) => (a.id < b.id ? a.id * 1000003 + b.id : b.id * 1000003 + a.id);

  function buildGrid() {
    grid.clear();
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      const cx = Math.floor(p.x / cellSize);
      const cy = Math.floor(p.y / cellSize);
      const k = key(cx, cy);
      let bucket = grid.get(k);
      if (!bucket) { bucket = []; grid.set(k, bucket); }
      bucket.push(p);
    }
  }

  // Formation centroids: each particle is nudged toward the average position
  // of its neighbours, so clusters travel together and reshape as they go.
  function updateFormations() {
    for (let i = 0; i < particles.length; i++) {
      const a = particles[i];
      const cx = Math.floor(a.x / cellSize);
      const cy = Math.floor(a.y / cellSize);
      let sx = 0, sy = 0, n = 0;

      for (let ox = -2; ox <= 2; ox++) {
        for (let oy = -2; oy <= 2; oy++) {
          const bucket = grid.get(key(cx + ox, cy + oy));
          if (!bucket) continue;
          for (let j = 0; j < bucket.length; j++) {
            const b = bucket[j];
            if (b === a) continue;
            const dx = a.x - b.x;
            const dy = a.y - b.y;
            if (dx * dx + dy * dy > CONFIG.cohesionRadiusSq) continue;
            sx += b.x; sy += b.y; n++;
          }
        }
      }

      if (n > 0) { a.cx = sx / n; a.cy = sy / n; a.neighbors = n; }
      else { a.cx = undefined; a.cy = undefined; a.neighbors = 0; }
    }
  }

  // Communication network: discover links between nearby particles, then age
  // them. A link's brightness scales with how many particles are in the local
  // cluster, so the network visibly strengthens as more join.
  function updateNetwork(dt) {
    // 1. discover new connections
    for (let i = 0; i < particles.length; i++) {
      const a = particles[i];
      const cx = Math.floor(a.x / cellSize);
      const cy = Math.floor(a.y / cellSize);

      for (let ox = -1; ox <= 1; ox++) {
        for (let oy = -1; oy <= 1; oy++) {
          const bucket = grid.get(key(cx + ox, cy + oy));
          if (!bucket) continue;
          for (let j = 0; j < bucket.length; j++) {
            const b = bucket[j];
            if (b === a) continue;
            if (b.id < a.id) continue;   // handle each pair once

            const dx = a.x - b.x;
            const dy = a.y - b.y;
            const d2 = dx * dx + dy * dy;
            if (d2 > CONFIG.netDistSq) continue;

            const k = pairKey(a, b);
            let link = links.get(k);
            if (!link) {
              link = { a, b, fade: 0, ax: a.x, ay: a.y, bx: b.x, by: b.y };
              links.set(k, link);
            }
            link.fade = Math.min(1, link.fade + CONFIG.netFadeIn * dt);
          }
        }
      }
    }

    // 2. age every link: fade out and drop the ones that stretched apart
    for (const [k, link] of links) {
      const a = link.a, b = link.b;

      // if either endpoint is gone, the line is orphaned: freeze it at
      // its last position and let it fade away to nothing
      if (a.dead || b.dead) {
        link.fade -= CONFIG.netFadeOut * dt;
        if (link.fade <= 0) links.delete(k);
        continue;
      }

      // remember the live position so an orphaned line has somewhere to sit
      link.ax = a.x; link.ay = a.y;
      link.bx = b.x; link.by = b.y;

      const dx = a.x - b.x;
      const dy = a.y - b.y;
      const d2 = dx * dx + dy * dy;

      if (d2 > CONFIG.netBreakDistSq) {
        link.fade -= CONFIG.netFadeOut * dt;
        if (link.fade <= 0) links.delete(k);
      } else if (d2 > CONFIG.netDistSq) {
        // hysteresis band: hold the link but let it dim
        link.fade = Math.max(0, link.fade - CONFIG.netFadeOut * 0.4 * dt);
      }
    }
  }

  // Links are drawn in hue buckets so strokeStyle is set a handful of times
  // per frame instead of once per link. Building an hsla() string for every
  // link was the main source of per-frame garbage.
  const HUE_BUCKETS = 12;
  const hueBucketPaths = new Array(HUE_BUCKETS);
  const hueBucketAlpha = new Float32Array(HUE_BUCKETS);

  function drawNetwork() {
    ctx.lineWidth = 0.6;

    // 1. bucket every visible link by hue, tracking the strongest alpha in
    //    each bucket so the whole bucket can share one stroke style.
    for (let i = 0; i < HUE_BUCKETS; i++) {
      hueBucketPaths[i] = null;
      hueBucketAlpha[i] = 0;
    }

    for (const link of links.values()) {
      const a = link.a, b = link.b;
      const orphaned = a.dead || b.dead;

      // orphaned lines use their frozen endpoints; live ones use the particles
      const ax = orphaned ? link.ax : a.x;
      const ay = orphaned ? link.ay : a.y;
      const bx = orphaned ? link.bx : b.x;
      const by = orphaned ? link.by : b.y;

      const dx = ax - bx;
      const dy = ay - by;
      const d2 = dx * dx + dy * dy;
      if (d2 > CONFIG.netBreakDistSq) continue;

      const t = 1 - d2 / CONFIG.netBreakDistSq;
      // cluster size drives the strength: more neighbours -> brighter network
      const cluster = Math.min(1, ((a.neighbors || 0) + (b.neighbors || 0)) / (CONFIG.netCluster * 2));
      const relativeSpeed = Math.hypot(a.vx - b.vx, a.vy - b.vy);
      const coherence = 1 - Math.min(1, relativeSpeed / 6);
      const strength = (CONFIG.netStrength + CONFIG.netBoost * cluster) * (0.38 + coherence * 0.62);
      const formationFade = shape ? 0.28 : 1;
      const alpha = t * t * strength * link.fade * formationFade;
      if (alpha <= 0.004) continue;

      const hue = (a.hue + b.hue) * 0.5;
      const bucket = clamp(Math.floor((hue / 360) * HUE_BUCKETS), 0, HUE_BUCKETS - 1);
      if (alpha > hueBucketAlpha[bucket]) hueBucketAlpha[bucket] = alpha;
      if (!hueBucketPaths[bucket]) hueBucketPaths[bucket] = [];
      hueBucketPaths[bucket].push(ax, ay, bx, by);
    }

    // 2. one stroke per non-empty bucket
    for (let i = 0; i < HUE_BUCKETS; i++) {
      const pts = hueBucketPaths[i];
      if (!pts) continue;
      const hue = ((i + 0.5) / HUE_BUCKETS) * 360;
      ctx.strokeStyle = `hsla(${hue}, 90%, 68%, ${hueBucketAlpha[i]})`;
      ctx.beginPath();
      for (let j = 0; j < pts.length; j += 4) {
        ctx.moveTo(pts[j], pts[j + 1]);
        ctx.lineTo(pts[j + 2], pts[j + 3]);
      }
      ctx.stroke();
    }
  }

  // Collisions: particles bounce off each other. Neither one is consumed -
  // they rebound, flash yellow, and a brand new particle is seeded at the
  // point of contact.
  function resolveCollisions() {
    // Collision separation looks good in the free field, but it fights the
    // target positions when a silhouette is forming. Let the shape solver win.
    if (shape) return;

    for (let i = 0; i < particles.length; i++) {
      const a = particles[i];
      const cx = Math.floor(a.x / cellSize);
      const cy = Math.floor(a.y / cellSize);

      for (let ox = -1; ox <= 1; ox++) {
        for (let oy = -1; oy <= 1; oy++) {
          const bucket = grid.get(key(cx + ox, cy + oy));
          if (!bucket) continue;
          for (let j = 0; j < bucket.length; j++) {
            const b = bucket[j];
            if (b === a) continue;
            if (b.id < a.id) continue;   // handle each pair once

            let dx = a.x - b.x;
            let dy = a.y - b.y;
            let d2 = dx * dx + dy * dy;
            if (d2 > CONFIG.mergeDistSq) continue;

            let d = Math.sqrt(d2);
            if (d < 0.0001) {
              // perfectly overlapping: nudge them apart on a random axis
              const ang = rand(0, Math.PI * 2);
              dx = Math.cos(ang); dy = Math.sin(ang); d = 1;
            }

            const nx = dx / d;
            const ny = dy / d;

            // 1. separate them so they stop overlapping
            const overlap = CONFIG.mergeDist - d;
            const push = overlap * 0.5;
            a.x += nx * push; a.y += ny * push;
            b.x -= nx * push; b.y -= ny * push;

            // 2. elastic rebound along the collision normal
            const rvx = a.vx - b.vx;
            const rvy = a.vy - b.vy;
            const vn = rvx * nx + rvy * ny;
            if (vn < 0) {
              const invA = 1 / a.mass;
              const invB = 1 / b.mass;
              const imp = -(1 + CONFIG.bounce) * vn / (invA + invB);
              a.vx += imp * invA * nx;
              a.vy += imp * invA * ny;
              b.vx -= imp * invB * nx;
              b.vy -= imp * invB * ny;

              // A small tangential exchange makes contacts feel like fluid
              // particles brushing past one another rather than hard balls.
              const tx = -ny, ty = nx;
              const vt = (a.vx - b.vx) * tx + (a.vy - b.vy) * ty;
              const slip = vt * 0.045;
              a.vx -= slip * tx; a.vy -= slip * ty;
              b.vx += slip * tx; b.vy += slip * ty;
            }

            // 3. both light up on contact
            a.contact = CONFIG.contactFlash;
            b.contact = CONFIG.contactFlash;
            a.flash = 1;
            b.flash = 1;
            a.absorbed++;
            b.absorbed++;
          }
        }
      }
    }
  }

  // ---------------------------------------------------------------- spawn
  function spawnBurst(x, y, n = CONFIG.burstCount) {
    const room = CONFIG.maxCount - particles.length;
    n = Math.min(n, Math.max(0, room));
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2);
      const s = rand(1.5, CONFIG.burstPower);
      const p = new Particle(x, y, {
        speed: 0,
        r: rand(0.6, 2.0),
      });
      p.vx = Math.cos(a) * s;
      p.vy = Math.sin(a) * s;
      p.energy = 1;
      particles.push(p);
    }
  }

  function maintainPopulation(dt) {
    // Particles die of old age, so the field is topped back up slowly rather
    // than instantly. This keeps the population hovering around baseCount
    // instead of snapping back the moment one dies. While a word is forming
    // the field is left alone so the shape is not diluted.
    if (shape) return;
    const deficit = CONFIG.baseCount - particles.length;
    if (deficit <= 0) return;
    spawnAccum += CONFIG.respawnRate * (dt / 60);
    while (spawnAccum >= 1 && particles.length < CONFIG.baseCount) {
      particles.push(spawnFromEdge());
      spawnAccum -= 1;
    }
  }

  // ---------------------------------------------------------------- swarms
  // A swarm is a fast-moving core that a group of particles chases. The core
  // wanders the field, steering away from the edges, and the particles orbit
  // it. Swarms are mortal too: after swarmLife seconds the core dissolves and
  // its members are released back into the free field.
  class Swarm {
    constructor(x, y) {
      this.x = x ?? rand(W * 0.15, W * 0.85);
      this.y = y ?? rand(H * 0.15, H * 0.85);
      const a = rand(0, Math.PI * 2);
      this.vx = Math.cos(a) * CONFIG.swarmSpeed;
      this.vy = Math.sin(a) * CONFIG.swarmSpeed;
      this.heading = a;
      this.age = 0;
      this.maxLife = CONFIG.swarmLife * rand(0.7, 1.3);
      this.hue = CONFIG.hueBase + rand(-CONFIG.hueSpread / 2, CONFIG.hueSpread / 2);
      this.members = [];
      this.dead = false;
    }

    step(dt) {
      // steer: drift the heading, and nudge it away from the walls
      this.heading += rand(-1, 1) * CONFIG.swarmTurn * dt;
      const margin = 140;
      if (this.x < margin) this.heading += 0.06 * dt;
      if (this.x > W - margin) this.heading -= 0.06 * dt;
      if (this.y < margin) this.heading += 0.06 * dt;
      if (this.y > H - margin) this.heading -= 0.06 * dt;

      const target = CONFIG.swarmSpeed;
      this.vx += Math.cos(this.heading) * 0.12 * dt;
      this.vy += Math.sin(this.heading) * 0.12 * dt;

      // keep the core at a steady, brisk pace
      const sp = Math.hypot(this.vx, this.vy) || 0.0001;
      const k = target / sp;
      this.vx *= k;
      this.vy *= k;

      this.x += this.vx * dt;
      this.y += this.vy * dt;

      // bounce off the frame so a swarm never leaves the view
      const pad = 60;
      if (this.x < pad) { this.x = pad; this.vx = Math.abs(this.vx); this.heading = 0; }
      else if (this.x > W - pad) { this.x = W - pad; this.vx = -Math.abs(this.vx); this.heading = Math.PI; }
      if (this.y < pad) { this.y = pad; this.vy = Math.abs(this.vy); this.heading = Math.PI / 2; }
      else if (this.y > H - pad) { this.y = H - pad; this.vy = -Math.abs(this.vy); this.heading = -Math.PI / 2; }

      this.age += dt / 60;
      if (this.age >= this.maxLife) this.dead = true;
    }
  }

  function spawnSwarm() {
    // Refuse to spawn when the field is full, otherwise the top-up loop in
    // updateSwarms would spin forever waiting for a swarm that never appears.
    if (particles.length >= CONFIG.maxCount) return false;

    const s = new Swarm();
    swarms.push(s);
    for (let i = 0; i < CONFIG.swarmSize; i++) {
      if (particles.length >= CONFIG.maxCount) break;
      const a = rand(0, Math.PI * 2);
      const r = rand(0, CONFIG.swarmRadius);
      const p = new Particle(s.x + Math.cos(a) * r, s.y + Math.sin(a) * r, {
        speed: rand(1.5, 3.5),
        r: rand(0.7, 2.0),
        life: rand(CONFIG.swarmLife, CONFIG.swarmLife * 1.6),
      });
      p.swarm = s;
      p.hue = s.hue + rand(-18, 18);
      s.members.push(p);
      particles.push(p);
    }
    return true;
  }

  function updateSwarms(dt) {
    for (let i = swarms.length - 1; i >= 0; i--) {
      const s = swarms[i];
      s.step(dt);
      if (s.dead) {
        // release the members so they rejoin the free field
        for (const p of s.members) p.swarm = null;
        swarms.splice(i, 1);
      }
    }
    // keep the swarm population topped up, but never spin if the field is full
    let guard = CONFIG.swarmCount + 1;
    while (swarms.length < CONFIG.swarmCount && guard-- > 0) {
      if (!spawnSwarm()) break;
    }
  }
