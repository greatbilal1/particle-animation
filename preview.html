    house: [25, 35], key: [45, 25], anchor: [210, 25], sword: [200, 20],
    lock: [45, 25], arrow: [200, 30], mountain: [215, 30], umbrella: [330, 60],
  };

  // Aliases so common words resolve to a silhouette.
  const ALIASES = {
    bunny: 'rabbit', hare: 'rabbit', kitty: 'cat', kitten: 'cat', puppy: 'dog',
    wolf: 'dog', birdie: 'bird', fishy: 'fish', star2: 'star', crescent: 'moon',
    love: 'heart', xmas: 'tree', pine: 'tree', home: 'house', auto: 'car',
    spaceship: 'rocket', spirit: 'ghost', bones: 'skull', fly: 'butterfly',
    bloom: 'flower', bolt: 'lightning', king: 'crown', peak: 'mountain',
    sky: 'cloud', pointer: 'arrow', lock: 'key', ship: 'anchor', blade: 'sword',
  };

  function resolveShape(text) {
    const t = text.trim().toLowerCase();
    // an empty silhouette array is truthy, so check .length explicitly:
    // otherwise "moon" resolves to a shape that draws nothing.
    if (SHAPES[t] && SHAPES[t].length) return t;
    const alias = ALIASES[t];
    if (alias && SHAPES[alias] && SHAPES[alias].length) return alias;
    return null;
  }

  // Rasterise a silhouette into a list of target points, scaled to the view.
  function sampleShape(name) {
    const paths = SHAPES[name];
    if (!paths || !paths.length) return null;

    // fit the 100x100 authoring box into the viewport with a margin
    const size = Math.min(W, H) * 0.62;
    const scale = size / 100;
    const cw = Math.ceil(size);
    const ch = Math.ceil(size);

    shapeCanvas.width = cw;
    shapeCanvas.height = ch;
    shapeCtx.setTransform(1, 0, 0, 1, 0, 0);
    shapeCtx.clearRect(0, 0, cw, ch);
    shapeCtx.fillStyle = '#fff';
    shapeCtx.beginPath();
    for (const path of paths) {
      if (path.length < 3) continue;
      shapeCtx.moveTo(path[0][0] * scale, path[0][1] * scale);
      for (let i = 1; i < path.length; i++) {
        shapeCtx.lineTo(path[i][0] * scale, path[i][1] * scale);
      }
      shapeCtx.closePath();
    }
    shapeCtx.fill();

    const data = shapeCtx.getImageData(0, 0, cw, ch).data;
    const points = sampleSilhouette(data, cw, ch);
    if (!points.length) return null;

    // --- feature layer ---------------------------------------------------
    // Small marks (eyes, ears, whiskers, stripes) are authored separately so
    // they survive rasterisation. A 4px eye inside a 600px silhouette would
    // otherwise be swallowed by the fill tier and read as a dim smudge. Here
    // they are stamped into their own mask and sampled as bright detail
    // points, then merged in front of the body points.
    const features = sampleFeatures(name, scale, cw, ch);
    if (features.length) {
      // features take priority: they are placed first so the budget keeps them
      points.unshift(...features);
    }

    // centre the drawing in the viewport
    const ox = (W - cw) / 2;
    const oy = (H - ch) / 2;
    return { points, ox, oy, cw, ch };
  }

  // Stamp the shape's feature marks into a mask and sample them densely.
  // Features are authored as { kind, ... } entries in the same 100x100 box:
  //   { kind: 'dot',  x, y, r }            - an eye / spot
  //   { kind: 'ring', x, y, r, w }         - an eye with a pupil ring
  //   { kind: 'line', x1, y1, x2, y2, w }  - a whisker / stripe / mouth
  //   { kind: 'arc',  x, y, r, a0, a1, w } - a curved brow / smile
  function sampleFeatures(name, scale, cw, ch) {
    const feats = SHAPE_FEATURES[name];
    if (!feats || !feats.length) return [];

    const fc = featureCanvas;
    fc.width = cw;
    fc.height = ch;
    const fx = featureCtx;
    fx.setTransform(1, 0, 0, 1, 0, 0);
    fx.clearRect(0, 0, cw, ch);
    fx.fillStyle = '#fff';
    fx.strokeStyle = '#fff';
    fx.lineCap = 'round';
    fx.lineJoin = 'round';

    for (const f of feats) {
      const w = (f.w || 2) * scale;
      fx.lineWidth = Math.max(1.5, w);
      if (f.kind === 'dot') {
        fx.beginPath();
        fx.arc(f.x * scale, f.y * scale, Math.max(1.5, f.r * scale), 0, Math.PI * 2);
        fx.fill();
      } else if (f.kind === 'ring') {
        fx.beginPath();
        fx.arc(f.x * scale, f.y * scale, Math.max(2, f.r * scale), 0, Math.PI * 2);
        fx.stroke();
      } else if (f.kind === 'line') {
        fx.beginPath();
        fx.moveTo(f.x1 * scale, f.y1 * scale);
        fx.lineTo(f.x2 * scale, f.y2 * scale);
        fx.stroke();
      } else if (f.kind === 'arc') {
        fx.beginPath();
        fx.arc(f.x * scale, f.y * scale, Math.max(2, f.r * scale), f.a0, f.a1);
        fx.stroke();
      }
    }

    const data = fx.getImageData(0, 0, cw, ch).data;
    const out = [];
    // Sample features on a finer grid than the body so small marks keep shape.
    const step = 2;
    for (let y = 0; y < ch; y += step) {
      for (let x = 0; x < cw; x += step) {
        if (data[(y * cw + x) * 4 + 3] > 128) {
          out.push({ x, y, tier: 'detail', d: 0, feature: true });
        }
      }
    }
    return out;
  }

  // Turn a rasterised silhouette into target points. The key idea is that a
  // shape reads as a real object when its OUTLINE is dense and its INTERIOR is
  // sparse with even gaps - a uniform fill just looks like a blob. So we build
  // a distance-to-edge field and sample in three tiers:
  //   edge   - the contour itself, sampled densely (the lit outline)
  //   detail - a thin band just inside the contour (gives the shape thickness)
  //   fill   - the deep interior, sampled on a coarse, evenly-spaced grid
  // Each point carries its tier so the renderer can size/brighten it.
  function sampleSilhouette(data, cw, ch) {
    const solid = (x, y) => {
      if (x < 0 || y < 0 || x >= cw || y >= ch) return false;
      return data[(y * cw + x) * 4 + 3] > 128;
    };

    // --- 1. distance-to-edge field (cheap two-pass chamfer) --------------
    // dist[i] = approximate distance in px from a solid pixel to the nearest
    // empty pixel. Empty pixels stay 0.
    const INF = 1e9;
    const dist = new Float32Array(cw * ch);
    for (let y = 0; y < ch; y++) {
      for (let x = 0; x < cw; x++) {
        dist[y * cw + x] = solid(x, y) ? INF : 0;
      }
    }
    // forward pass
    for (let y = 0; y < ch; y++) {
      for (let x = 0; x < cw; x++) {
        const i = y * cw + x;
        if (dist[i] === 0) continue;
        let d = dist[i];
        if (x > 0) d = Math.min(d, dist[i - 1] + 1);
        if (y > 0) d = Math.min(d, dist[i - cw] + 1);
        if (x > 0 && y > 0) d = Math.min(d, dist[i - cw - 1] + 1.414);
        if (x < cw - 1 && y > 0) d = Math.min(d, dist[i - cw + 1] + 1.414);
        dist[i] = d;
      }
    }
    // backward pass
    for (let y = ch - 1; y >= 0; y--) {
      for (let x = cw - 1; x >= 0; x--) {
        const i = y * cw + x;
        if (dist[i] === 0) continue;
        let d = dist[i];
        if (x < cw - 1) d = Math.min(d, dist[i + 1] + 1);
        if (y < ch - 1) d = Math.min(d, dist[i + cw] + 1);
        if (x < cw - 1 && y < ch - 1) d = Math.min(d, dist[i + cw + 1] + 1.414);
        if (x > 0 && y < ch - 1) d = Math.min(d, dist[i + cw - 1] + 1.414);
        dist[i] = d;
      }
    }

    // --- 2. classify every solid pixel into a tier ----------------------
    // Thresholds scale with the shape so small silhouettes still get a band.
    const maxDist = Math.max(2, Math.min(cw, ch) * 0.06);
    const edgeBand = 1.6;                 // px: on the contour
    const detailBand = maxDist * 0.55;    // px: just inside the contour

    const points = [];
    const step = 2;
    for (let y = 0; y < ch; y += step) {
      for (let x = 0; x < cw; x += step) {
        if (!solid(x, y)) continue;
        const d = dist[y * cw + x];
        let tier;
        if (d <= edgeBand) tier = 'edge';
        else if (d <= detailBand) tier = 'detail';
        else tier = 'fill';
        points.push({ x, y, tier, d });
      }
    }
    return points;
  }

  function formWord(text) {
    const name = resolveShape(text);
    if (!name) {
      // no silhouette for this word: fall back to spelling it out
      return formText(text);
    }
    const sampled = sampleShape(name);
    if (!sampled) return;
    assignTargets(sampled.points, sampled.ox, sampled.oy, name, sampled.cw, sampled.ch);
  }

  // Fallback for words with no silhouette: spell the word out in particles.
  function formText(text) {
    const fontSize = Math.min(W, H) * 0.34;
    const font = `900 ${fontSize}px ui-monospace, Menlo, monospace`;

    shapeCtx.setTransform(1, 0, 0, 1, 0, 0);
    shapeCtx.font = font;
    const metrics = shapeCtx.measureText(text);
    const pad = fontSize * 0.25;
    const cw = Math.ceil(metrics.width + pad * 2);
    const ch = Math.ceil(fontSize * 1.5);

    shapeCanvas.width = cw;
    shapeCanvas.height = ch;
    shapeCtx.font = font;
    shapeCtx.textAlign = 'center';
    shapeCtx.textBaseline = 'middle';
    shapeCtx.clearRect(0, 0, cw, ch);
    shapeCtx.fillStyle = '#fff';
    shapeCtx.fillText(text, cw / 2, ch / 2);

    const data = shapeCtx.getImageData(0, 0, cw, ch).data;
    const points = sampleSilhouette(data, cw, ch);
    if (!points.length) return;

    for (let i = points.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [points[i], points[j]] = [points[j], points[i]];
    }

    const ox = (W - cw) / 2;
    const oy = (H - ch) / 2;
    assignTargets(points, ox, oy, text, cw, ch);
  }

  // Choose only as many particles as the silhouette can use cleanly. The
  // budget is derived from the displayed shape area and then capped by the
  // number of living particles already in the field. No formation-only births.
  // Because the interior is now sampled sparsely, a larger budget mostly goes
  // into a denser, more continuous outline rather than a denser blob.
  function calculateShapeParticleCount(points, cw, ch) {
    const areaRatio = clamp(points.length / Math.max(1, cw * ch / 4), 0.12, 1.0);
    const shapeArea = cw * ch * areaRatio;
    const density = Math.max(2.2, CONFIG.shapeParticleSpacing * CONFIG.shapeParticleSpacing);
    const estimated = Math.sqrt(shapeArea / density) * 22;
    return Math.round(clamp(estimated, CONFIG.shapeMinParticles, CONFIG.shapeMaxParticles));
  }

  // Allocate the particle budget across the three tiers. The outline is the
  // most important cue for recognising a shape, so it is filled first and at
  // full density; the detail band comes next; whatever is left goes to the
  // interior, where we deliberately keep gaps so the shape does not blob up.
  //
  // Feature marks (eyes, whiskers, stripes) are protected: they are few and
  // tiny, so they are reserved up front and never dropped by the sampler.
  function sampleForParticleBudget(points, count) {
    if (points.length <= count) return points.slice();

    const feat = [], edge = [], detail = [], fill = [];
    for (const p of points) {
      if (p.feature) feat.push(p);
      else if (p.tier === 'edge') edge.push(p);
      else if (p.tier === 'detail') detail.push(p);
      else fill.push(p);
    }

    // Features are cheap and carry the most identity, so they always survive.
    const featBudget = Math.min(feat.length, Math.max(12, Math.round(count * 0.14)));
    const rest = count - featBudget;

    // Reserve the outline and detail bands next, but never let them starve
    // the interior completely - a shape with no fill reads as a wireframe.
    const edgeBudget = Math.min(edge.length, Math.round(rest * 0.46));
    const detailBudget = Math.min(detail.length, Math.round(rest * 0.30));
    const fillBudget = Math.max(0, rest - edgeBudget - detailBudget);

    const result = [];
    result.push(...evenSample(feat, featBudget));
    result.push(...evenSample(edge, edgeBudget));
    result.push(...evenSample(detail, detailBudget));
    result.push(...evenSample(fill, fillBudget));
    return result;
  }

  // Pick `count` points spread evenly through a list, preserving order so the
  // silhouette stays uniformly covered instead of clumping.
  function evenSample(list, count) {
    if (count <= 0) return [];
    if (list.length <= count) return list.slice();
    const out = [];
    const stride = list.length / count;
    for (let i = 0; i < count; i++) {
      const idx = Math.min(list.length - 1, Math.floor(i * stride + stride * 0.5));
      out.push(list[idx]);
    }
    return out;
  }

  // Shared assignment: hand a carefully sized subset of living particles the
  // target points. All other particles remain part of the environment.
  //
  // The important part is HOW particles are matched to targets. Shuffling the
  // pool at random makes every particle cross the field to an arbitrary point,
  // which reads as chaos. Instead we match each target to the nearest available
  // particle, so the new shape is assembled from whichever particles already
  // sit closest to it - the silhouette appears to flow and re-form in place.
  function assignTargets(points, ox, oy, label, cw = W, ch = H) {
    // release any swarm members so they can join the formation
    for (const s of swarms) for (const p of s.members) p.swarm = null;
    swarms.length = 0;

    // A new shape cancels any dissolve still in flight: the particles that
    // were melting away are simply re-recruited into the new silhouette.
    if (shape && shape.dissolving) {
      shape = null;
      shapeEl.style.opacity = '';
    }

    const living = particles.filter(p => !p.dead);
    const desired = calculateShapeParticleCount(points, cw, ch);
    const n = Math.min(desired, living.length, points.length);
    const targetPoints = sampleForParticleBudget(points, n).sort((a, b) => {
      const ya = Math.floor(a.y / 12), yb = Math.floor(b.y / 12);
      if (ya !== yb) return ya - yb;
      return a.x - b.x;
    });

    const shapeSize = Math.min(cw, ch);
    const baseCx = (W - cw) / 2 + cw / 2;
    const baseCy = (H - ch) / 2 + ch / 2;

    // Re-tint the formation toward its own palette so each shape has identity.
    const palette = PALETTES[label] || [CONFIG.hueBase, CONFIG.hueSpread];
    const [palHue, palSpread] = palette;

    // Absolute target positions, computed once so the matcher can measure
    // real distances in screen space.
    const absTargets = targetPoints.map(pt => ({
      x: ox + pt.x + rand(-CONFIG.shapeJitter, CONFIG.shapeJitter),
      y: oy + pt.y + rand(-CONFIG.shapeJitter, CONFIG.shapeJitter),
      tier: pt.tier,
      feature: pt.feature,
    }));

    // Match targets to the nearest particles. A spatial grid keeps this near
    // O(n) instead of O(n^2) even with several hundred particles.
    const matched = matchTargetsToParticles(absTargets, living);

    for (let i = 0; i < matched.length; i++) {
      const p = matched[i].particle;
      const t = matched[i].target;
      if (!p) continue;

      p.swarm = null;
      p.tx = t.x;
      p.ty = t.y;
      p.arrived = false;
      p.inFormation = true;
      // Particles that were already in a formation keep their stagger so the
      // transition stays continuous; fresh ones get a new random delay.
      p.targetDelay = p.tier ? p.targetDelay * 0.5 : rand(0, CONFIG.shapeDelayMax);
      p.targetSeed = rand(0, Math.PI * 2);
      // Blend toward the palette rather than snapping, so the field's own
      // colour still shows through and the transition is not jarring.
      const targetHue = palHue + rand(-palSpread / 2, palSpread / 2);
      p.hue += (targetHue - p.hue) * 0.85;
      // The tier decides how prominent this particle is in the silhouette:
      // the outline is the lit contour, the detail band gives it thickness,
      // and the interior stays dim so the shape reads as a hollow form.
      p.tier = t.tier;
      p.edge = t.tier === 'edge';
      p.edgeBoost = t.tier === 'edge' ? rand(0.75, 1.0)
                  : t.tier === 'detail' ? rand(0.30, 0.55)
                  : 0;

      // Nudge existing momentum toward the new target instead of launching the
      // particle from an artificial velocity. Because the target is now the
      // nearest one, this nudge is small and the motion stays smooth.
      const dx = t.x - p.x;
      const dy = t.y - p.y;
      const d = Math.hypot(dx, dy) || 1;
      const tangential = rand(-1, 1) * 0.6;
      p.vx += (dx / d) * rand(0.05, 0.25) - (dy / d) * tangential;
      p.vy += (dy / d) * rand(0.05, 0.25) + (dx / d) * tangential;
    }

    // Everything not selected for the silhouette stays free. Particles that
    // were in the previous shape are released gently rather than flung.
    const selected = new Set(matched.map(m => m.particle));
    for (const p of particles) {
      if (!selected.has(p)) {
        if (p.tx !== null) {
          // ease the outgoing particle away from the shape instead of a burst
          const dx = p.x - baseCx;
          const dy = p.y - baseCy;
          const d = Math.hypot(dx, dy) || 1;
          const drift = rand(0.25, 0.8);
          p.vx += (dx / d) * drift;
          p.vy += (dy / d) * drift;
        }
        p.tx = null;
        p.ty = null;
        p.arrived = false;
        p.inFormation = false;
        p.tier = null;
        p.edge = false;
        p.edgeBoost = 0;
      }
    }

    shape = {
      text: label,
      age: 0,
      hold: CONFIG.shapeHold,
      baseCx,
      baseCy,
      cx: baseCx,
      cy: baseCy,
      size: shapeSize,
      particleCount: matched.length,
      seed: rand(0, Math.PI * 2),
      dissolving: false,
      dissolveAge: 0,
    };
    shapeEl.textContent = label;
    shapeEl.style.opacity = '';
  }

  // Greedy nearest-neighbour matching between target points and particles.
  // Targets are processed in a spatially coherent order and each claims the
  // closest still-free particle, so the resulting assignment is local: no
  // particle has to travel across the whole field to reach its new home.
  function matchTargetsToParticles(targets, pool) {
    if (!pool.length) return targets.map(t => ({ target: t, particle: null }));

    // Bucket particles into a coarse grid for fast nearest lookups.
    const cell = 90;
    const grid = new Map();
    const gkey = (cx, cy) => cx * 100003 + cy;
    for (const p of pool) {
      const k = gkey(Math.floor(p.x / cell), Math.floor(p.y / cell));
      let b = grid.get(k);
      if (!b) { b = []; grid.set(k, b); }
      b.push(p);
    }

    const taken = new Set();
    const result = [];

    // Search outward ring by ring until we find a free particle. The radius
    // grows so a target in a sparse region still finds a match.
    const findNearest = (tx, ty) => {
      const cx = Math.floor(tx / cell), cy = Math.floor(ty / cell);
      let best = null, bestD2 = Infinity;
      for (let ring = 0; ring <= 6; ring++) {
        for (let ox = -ring; ox <= ring; ox++) {
          for (let oy = -ring; oy <= ring; oy++) {
            // only the shell of the ring is new
            if (ring > 0 && Math.abs(ox) !== ring && Math.abs(oy) !== ring) continue;
            const b = grid.get(gkey(cx + ox, cy + oy));
            if (!b) continue;
            for (const p of b) {
              if (taken.has(p)) continue;
              const dx = p.x - tx, dy = p.y - ty;
              const d2 = dx * dx + dy * dy;
              if (d2 < bestD2) { bestD2 = d2; best = p; }
            }
          }
        }
        // Once something is found, one more ring guarantees the true nearest.
        if (best && ring >= 1) break;
      }
      return best;
    };

    for (const t of targets) {
      const p = findNearest(t.x, t.y);
      if (p) taken.add(p);
      result.push({ target: t, particle: p });
    }
    return result;
  }

  // Hand a single particle back to the free field. `gentle` eases it out of
  // the formation with a small outward drift; the hard path is only used when
  // the user explicitly clears the shape and we want an immediate response.
  function releaseParticle(p, gentle) {
    if (p.tx !== null) {
      const dx = p.x - (shape ? shape.cx : W / 2);
      const dy = p.y - (shape ? shape.cy : H / 2);
      const d = Math.hypot(dx, dy) || 1;
      // A gentle release nudges the particle along its own outward direction
      // so it peels away from the silhouette instead of exploding from it.
      const push = gentle ? rand(0.15, 0.55) : rand(1.0, 3.0);
      p.vx += (dx / d) * push;
      p.vy += (dy / d) * push;
    }
    p.tx = null;
    p.ty = null;
    p.arrived = false;
    p.targetDelay = 0;
    p.inFormation = false;
    p.tier = null;
    p.edge = false;
    p.edgeBoost = 0;
  }

  // Begin melting the formation back into the ambient flow. Particles are
  // released in a staggered wave over CONFIG.shapeDissolve seconds, so the
  // silhouette thins out from its edges inward rather than vanishing at once.
  function dissolveShape() {
    if (!shape || shape.dissolving) return;
    shape.dissolving = true;
    shape.dissolveAge = 0;
    // Give every particle its own release moment, biased so the outline goes
    // first and the core lingers - that reads as the shape "breathing out".
    for (const p of particles) {
      if (p.tx === null) continue;
      const edgeBias = p.tier === 'edge' ? 0 : p.tier === 'detail' ? 0.25 : 0.5;
      p.releaseAt = edgeBias + rand(0, 0.5);
    }
  }

  // Immediate clear: used when the user empties the input or switches away.
  function clearShape() {
    for (const p of particles) releaseParticle(p, false);
    shape = null;
    shapeEl.textContent = 'free';
  }

  function updateShape(dt) {
    if (!shape) return;

    shape.age += dt / 60;
    const w = W, h = H;
    let tx = shape.baseCx;
    let ty = shape.baseCy;

    // The centroid drift comes from the same registry entry that drives the
    // per-particle deformation, so the two can no longer be tuned apart.
    const behavior = SHAPE_BEHAVIORS[shape.text];
    if (behavior && behavior.centroid) {
      const c = behavior.centroid(time, shape.seed, w, h);
      tx += c.dx || 0;
      ty += c.dy || 0;
    }

    // Keep moving formations comfortably inside the viewport.
    const marginX = Math.min(w * 0.16, shape.size * 0.38);
    const marginY = Math.min(h * 0.18, shape.size * 0.38);
    shape.cx = clamp(tx, marginX, w - marginX);
    shape.cy = clamp(ty, marginY, h - marginY);

    // --- dissolve phase --------------------------------------------------
    // Once the hold expires the shape does not pop: it melts. Each particle
    // waits for its own release moment, then eases back into free flight.
    if (shape.dissolving) {
      shape.dissolveAge += dt / 60;
      const progress = shape.dissolveAge / CONFIG.shapeDissolve;
      for (const p of particles) {
        if (p.tx === null) continue;
        if (progress >= p.releaseAt) releaseParticle(p, true);
      }
      // Fade the label out with the formation.
      shapeEl.style.opacity = String(clamp(1 - progress, 0, 1));
      if (progress >= 1) {
        shape = null;
        shapeEl.textContent = 'free';
        shapeEl.style.opacity = '';
      }
      return;
    }

    if (shape.age >= shape.hold) dissolveShape();
  }

  // ---------------------------------------------------------------- resize
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = '#05060a';
    ctx.fillRect(0, 0, W, H);
  }

  function drawShapeEffects() {
    if (!shape) return;
    const x = shape.cx, y = shape.cy;
    const behavior = SHAPE_BEHAVIORS[shape.text];
    const pulse = 0.5 + 0.5 * Math.sin(time * 1.4);

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

    // A soft coloured bloom behind the whole formation, tinted to its palette.
    // This is what makes the silhouette feel lit from within rather than just
    // being a scatter of dots.
    const palette = PALETTES[shape.text] || [CONFIG.hueBase, CONFIG.hueSpread];
    const bloomR = shape.size * 0.62;
    const bloom = ctx.createRadialGradient(x, y, bloomR * 0.15, x, y, bloomR);
    bloom.addColorStop(0, `hsla(${palette[0]}, 85%, 62%, ${0.05 + pulse * 0.02})`);
    bloom.addColorStop(0.55, `hsla(${palette[0]}, 85%, 55%, 0.02)`);
    bloom.addColorStop(1, `hsla(${palette[0]}, 85%, 50%, 0)`);
    ctx.fillStyle = bloom;
    ctx.beginPath(); ctx.arc(x, y, bloomR, 0, Math.PI * 2); ctx.fill();

    if (behavior && behavior.effects) {
      behavior.effects(ctx, x, y, time, pulse);
    } else {
      // A very subtle ambient halo keeps every selected object alive.
      const g = ctx.createRadialGradient(x, y, 20, x, y, 150);
      g.addColorStop(0, 'rgba(110,180,255,0.025)');
      g.addColorStop(1, 'rgba(110,180,255,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, 150, 0, Math.PI * 2); ctx.fill();
    }

    ctx.restore();
  }

  // ---------------------------------------------------------------- loop
  function frame(now) {
    const rawDt = (now - last) / 1000;
    last = now;
    const dt = clamp(rawDt, 0.001, 0.05) * 60;   // normalized to ~60fps units
    time += rawDt;

    // motion-trail fade instead of a hard clear
    ctx.fillStyle = `rgba(5, 6, 10, ${CONFIG.trailAlpha})`;
    ctx.fillRect(0, 0, W, H);

    // 1. move everything
    for (let i = 0; i < particles.length; i++) particles[i].step(dt);
    updateSwarms(dt);
    updateShape(dt);

    // 2. rebuild the spatial grid, then let formations and collisions react
    buildGrid();
    updateFormations();
    const collided = !shape;   // collisions are skipped while a shape forms
    resolveCollisions();

    // 3. compact the array, dropping particles that have died of old age
    let w = 0;
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      if (p.dead) continue;
      particles[w++] = p;
    }
    particles.length = w;

    // 3b. slowly top the field back up as particles expire
    maintainPopulation(dt);

    // 4. rebuild the grid only if collisions actually moved particles,
    //    then refresh the network
    if (collided) buildGrid();
    updateNetwork(dt);

    // 5. draw the network first, then the particles on top
    drawNetwork();
    drawShapeEffects();
    for (let i = 0; i < particles.length; i++) particles[i].draw();

    // fps meter
    fpsAccum += rawDt;
    fpsFrames++;
    if (fpsAccum >= 0.5) {
      fpsEl.textContent = Math.round(fpsFrames / fpsAccum);
      countEl.textContent = particles.length;
      fpsAccum = 0;
      fpsFrames = 0;
    }

    requestAnimationFrame(frame);
  }

  // ---------------------------------------------------------------- input
  window.addEventListener('pointermove', (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.active = true;
  });

  window.addEventListener('pointerdown', (e) => {
    mouse.down = true;
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.active = true;
    spawnBurst(e.clientX, e.clientY);
  });

  window.addEventListener('pointerup', () => { mouse.down = false; });

  window.addEventListener('pointerleave', () => {
    mouse.active = false;
    mouse.down = false;
  });

  window.addEventListener('resize', resize);

  // ---------------------------------------------------------------- word input
  const PRESETS = Object.keys(SHAPES).filter(name => SHAPES[name] && SHAPES[name].length);

  for (const word of PRESETS) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = word;
    b.addEventListener('click', () => {
      for (const chip of chipsEl.querySelectorAll('button')) chip.classList.remove('active');
      b.classList.add('active');
      wordInput.value = word;
      formWord(word);
    });
    chipsEl.appendChild(b);
  }

  function setActivePreset(name) {
    for (const chip of chipsEl.querySelectorAll('button')) {
      chip.classList.toggle('active', chip.textContent === name);
    }
  }

  promptForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = wordInput.value.trim();
    if (!text) { clearShape(); return; }
    setActivePreset(resolveShape(text) || '');
    formWord(text);
  });

  // typing a new word while a shape is held re-forms it live
  wordInput.addEventListener('input', () => {
    const text = wordInput.value.trim();
    if (!text) { clearShape(); return; }
    const resolved = resolveShape(text);
    if (resolved) {
      setActivePreset(resolved);
      formWord(text);
    }
  });

  // ---------------------------------------------------------------- tuning panel
  // Press "T" to toggle. Exposes the handful of CONFIG values that are worth
  // dialling in live; everything else stays in the source.
  const TUNING = [
    ['attract', 0, 0.3, 0.005],
    ['swirl', 0, 3, 0.05],
    ['friction', 0.9, 1, 0.001],
    ['maxSpeed', 0.5, 8, 0.1],
    ['wander', 0, 0.3, 0.005],
    ['cohesion', 0, 0.1, 0.002],
    ['netStrength', 0, 1, 0.02],
    ['netBoost', 0, 1, 0.02],
    ['trailAlpha', 0.02, 0.6, 0.01],
    ['shapeHold', 2, 30, 0.5],
    ['shapeOrbit', 0, 3, 0.05],
    ['shapeNoise', 0, 1.5, 0.05],
    ['shapeDeform', 0, 3, 0.05],
    ['swarmCount', 0, 12, 1],
    ['swarmSpeed', 0.5, 8, 0.1],
  ];

  let tuningEl = null;

  function buildTuningPanel() {
    tuningEl = document.createElement('div');
    tuningEl.style.cssText = [
      'position:fixed', 'right:16px', 'bottom:16px', 'z-index:20',
      'width:230px', 'max-height:70vh', 'overflow-y:auto',
      'padding:10px 12px', 'border-radius:12px',
      'background:rgba(8,12,22,0.88)', 'border:1px solid rgba(90,130,190,0.35)',
      'backdrop-filter:blur(8px)', 'color:#cfe2ff',
      'font:10px ui-monospace,Menlo,monospace', 'letter-spacing:0.06em',
      'display:none',
    ].join(';');

    const head = document.createElement('div');
    head.textContent = 'TUNING  (T to hide)';
    head.style.cssText = 'margin-bottom:8px;color:rgba(140,200,255,0.9);letter-spacing:0.18em';
    tuningEl.appendChild(head);

    for (const [key, min, max, step] of TUNING) {
      const row = document.createElement('label');
      row.style.cssText = 'display:block;margin-bottom:7px';

      const label = document.createElement('span');
      label.textContent = `${key}  ${CONFIG[key]}`;
      label.style.cssText = 'display:block;margin-bottom:2px;color:rgba(180,210,255,0.7)';

      const input = document.createElement('input');
      input.type = 'range';
      input.min = min; input.max = max; input.step = step;
      input.value = CONFIG[key];
      input.style.cssText = 'width:100%;accent-color:#5a96f0';
      input.addEventListener('input', () => {
        CONFIG[key] = parseFloat(input.value);
        label.textContent = `${key}  ${CONFIG[key]}`;
        // keep the derived squared values in sync
        if (key === 'mouseRadius') CONFIG.mouseRadiusSq = CONFIG.mouseRadius ** 2;
        if (key === 'cohesionRadius') CONFIG.cohesionRadiusSq = CONFIG.cohesionRadius ** 2;
      });

      row.appendChild(label);
      row.appendChild(input);
      tuningEl.appendChild(row);
    }

    document.body.appendChild(tuningEl);
  }

  window.addEventListener('keydown', (e) => {
    if (e.key === 't' || e.key === 'T') {
      if (!tuningEl) buildTuningPanel();
      tuningEl.style.display = tuningEl.style.display === 'none' ? 'block' : 'none';
    }
  });

  // ---------------------------------------------------------------- boot
  resize();
  // Seed a healthy field once. Later shapes reorganise these particles rather
  // than creating special shape-only particles.
  for (let i = 0; i < Math.min(CONFIG.baseCount, CONFIG.maxCount); i++) particles.push(new Particle());
  for (let i = 0; i < CONFIG.swarmCount; i++) spawnSwarm();
  requestAnimationFrame((t) => { last = t; frame(t); });
})();
</script>
</body>
</html>
